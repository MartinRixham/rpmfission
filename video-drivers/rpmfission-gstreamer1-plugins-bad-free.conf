# Let dnf replace Fedora's gstreamer1-plugins-bad-free (and its subpackages)
# with rpmfission's build, which fixes the v4l2codecs plugin. Fedora sets
# allow_vendor_change=False, and the two builds have different vendors
# ("Fedora Project" and none), so without this dnf skips the upgrade.
#
# Only for that source package, and only to the build from the rpmfission
# repository.
version = '1.1'

[[outgoing_packages]]
filters = [
  { filter = 'source_name', value = 'gstreamer1-plugins-bad-free' }
]

[[incoming_packages]]
filters = [
  { filter = 'source_name', value = 'gstreamer1-plugins-bad-free' },
  { filter = 'repoid', value = 'rpmfission' }
]

[[outgoing_vendors]]
vendor = 'Fedora Project'
