# Let dnf replace Fedora's builds of the packages this repository carries with
# fixes, under Fedora's package names: gstreamer1-plugins-bad-free (the
# v4l2codecs plugin) and mesa (Honeykrisp, the Apple Silicon Vulkan driver),
# with their subpackages. Fedora sets allow_vendor_change=False, and the
# builds have different vendors ("Fedora Project" and none), so without this
# dnf skips the upgrade.
#
# Only for those source packages, and only to builds from the rpmfission
# repository. Each [[outgoing_packages]] and [[incoming_packages]] table is
# one rule; a package matches the list if it matches any of them.
version = '1.1'

[[outgoing_packages]]
filters = [
  { filter = 'source_name', value = 'gstreamer1-plugins-bad-free' }
]

[[outgoing_packages]]
filters = [
  { filter = 'source_name', value = 'mesa' }
]

[[incoming_packages]]
filters = [
  { filter = 'source_name', value = 'gstreamer1-plugins-bad-free' },
  { filter = 'repoid', value = 'rpmfission' }
]

[[incoming_packages]]
filters = [
  { filter = 'source_name', value = 'mesa' },
  { filter = 'repoid', value = 'rpmfission' }
]

[[outgoing_vendors]]
vendor = 'Fedora Project'
