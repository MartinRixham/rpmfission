name: Build RPMs

on:
  push:
    branches: [main]
  # Builds the packages a pull request changes, without publishing.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to build, or "all"
        default: all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fedora releases to build for. Add a release when it branches or ships, and
  # remove it when it goes end of life; its chroot is then deleted from the
  # published repository on the next publish.
  FEDORA_RELEASES: '[44, 45]'
  # Architectures to build for, each on a runner of its own architecture (see
  # build-rpms.yml). aarch64 is also the repository for Fedora Asahi Remix.
  FEDORA_ARCHES: '["x86_64", "aarch64"]'

jobs:
  plan:
    runs-on: ubuntu-latest
    # For rpmspec, to read each package's architectures
    container:
      image: registry.fedoraproject.org/fedora:latest
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
      builds-with-repo: ${{ steps.builds.outputs.builds-with-repo }}
      tests: ${{ steps.builds.outputs.tests }}
    steps:
      # git before checkout, or it downloads the tree without history
      - name: Install tools
        run: dnf -y install git jq rpm-build rust-srpm-macros

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A package is a top-level directory holding <name>/<name>.spec.
      # Each build is one package in one mock chroot (named as COPR names it).
      # A chroot not yet on gh-pages, such as a newly added release, gets
      # every package. A package is left out of chroots whose architecture
      # its ExclusiveArch or ExcludeArch rules out, as COPR does; noarch
      # packages build in every chroot. A spec's rpmfission-fedora lines
      # limit the releases it builds for (see .github/scripts/release-ok.sh),
      # so that a package can have a spec per range of releases, such as
      # ffmpeg and ffmpeg8.
      #
      # Packages with a BuildRequires on another package of this repository
      # (<pkg>, <pkg>-devel, <pkg>-libs or <pkg>-static) build in a second
      # stage, against the RPMs of the first and the published repository.
      # Their own build dependencies must be in the first stage.
      - id: builds
        env:
          REQUESTED: ${{ inputs.packages }}
          # The base branch for a pull request, whose merge commit is GITHUB_SHA
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The container runs as root but the checkout is owned by the runner
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          all=$(for spec in */*.spec; do dirname "$spec"; done | sort -u)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REQUESTED" = all ]; then
              selected=$all
            else
              selected=$REQUESTED
            fi
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            selected=$all
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(\.copr|\.github)/'; then
            selected=$all
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | cut -d/ -f1 | sort -u)
            selected=$(comm -12 <(echo "$all") <(echo "$changed"))
          fi

          repo_deps() {
            sed -nE 's/^BuildRequires:[[:space:]]*([^[:space:]]+).*/\1/p' "$1/$1.spec" |
              sed -E 's/-(devel|libs|static)$//' | sort -u | comm -12 - <(echo "$all")
          }

          # A malformed rpmfission-fedora line fails here, not silently in
          # the command substitutions below
          for spec in */*.spec; do
            rc=0
            .github/scripts/release-ok.sh 0 "$spec" || rc=$?
            [ "$rc" -ne 2 ] || exit 1
          done

          builds_for() {
            local release=$1 arch=$2 package exclusive exclude
            shift 2
            for package; do
              .github/scripts/release-ok.sh "$release" "$package/$package.spec" || continue
              exclusive=$(rpmspec -q --srpm --qf '[%{EXCLUSIVEARCH} ]' "$package/$package.spec")
              exclude=$(rpmspec -q --srpm --qf '[%{EXCLUDEARCH} ]' "$package/$package.spec")
              if [ -n "$exclusive" ] && ! grep -qw -- "$arch" <<< "$exclusive"; then
                continue
              fi
              grep -qw -- "$arch" <<< "$exclude" && continue
              echo "$package"
            done
          }

          builds=$(
            for release in $(jq -r '.[]' <<< "$FEDORA_RELEASES"); do
            for arch in $(jq -r '.[]' <<< "$FEDORA_ARCHES"); do
              chroot=fedora-$release-$arch
              if git rev-parse -q --verify origin/gh-pages > /dev/null &&
                 [ -n "$(git ls-tree -d origin/gh-pages -- "$chroot")" ]; then
                packages=$selected
              else
                packages=$all
              fi
              for package in $(builds_for "$release" "$arch" $packages); do
                with_repo=false
                [ -n "$(repo_deps "$package")" ] && with_repo=true
                jq -nc --arg package "$package" --arg chroot "$chroot" \
                  --argjson with_repo "$with_repo" \
                  '{package: $package, chroot: $chroot, with_repo: $with_repo}'
              done
            done
            done | jq -sc .
          )
          echo "builds=$(jq -c 'map(select(.with_repo | not) | del(.with_repo))' <<< "$builds")" >> "$GITHUB_OUTPUT"
          echo "builds-with-repo=$(jq -c 'map(select(.with_repo) | del(.with_repo))' <<< "$builds")" >> "$GITHUB_OUTPUT"

          # Every build is tested (see .github/scripts/run-tests.sh), with
          # the release for the container
          echo "tests=$(jq -c 'map(del(.with_repo) | .release = (.chroot | split("-")[1]))' \
            <<< "$builds")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    uses: ./.github/workflows/build-rpms.yml
    with:
      builds: ${{ needs.plan.outputs.builds }}

  build-with-repo:
    needs: [plan, build]
    # After the first stage, whether it built, failed or had nothing to build
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.builds-with-repo != '[]'
    uses: ./.github/workflows/build-rpms.yml
    with:
      builds: ${{ needs.plan.outputs.builds-with-repo }}
      with-repo: true

  # Runs each build's tests (tests/ and <pkg>/tests/, see
  # .github/scripts/run-tests.sh) in a container of the chroot's release, on a
  # runner of its architecture, against the RPMs of both build stages. A pass
  # leaves a tested-<pkg>-<chroot> artifact, without which publish leaves out
  # that package's RPMs for the chroot.
  test:
    needs: [plan, build, build-with-repo]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.tests != '[]'
    runs-on: ${{ endsWith(matrix.chroot, '-aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.release }}
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: rpms-${{ matrix.package }}-${{ matrix.chroot }}
          path: own
        # A package that failed to build has nothing to test or publish
        continue-on-error: true

      - uses: actions/download-artifact@v7
        with:
          pattern: rpms-*
          merge-multiple: true
          path: run

      - name: Run tests
        id: tests
        if: hashFiles('own/**/*.rpm') != ''
        env:
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          .github/scripts/run-tests.sh ${{ matrix.package }} ${{ matrix.chroot }} \
            run/${{ matrix.chroot }} own/${{ matrix.chroot }}
          mkdir -p tested
          touch tested/${{ matrix.package }}-${{ matrix.chroot }}

      - if: steps.tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tested-${{ matrix.package }}-${{ matrix.chroot }}
          path: tested/

  publish:
    needs: [plan, build, build-with-repo, test]
    # Publish whatever built, even if some packages in the matrix failed, but
    # not the RPMs of a package whose tests did not pass.
    # Only main publishes; other branches, such as update PRs, only build.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (contains(fromJSON('["success", "failure"]'), needs.build.result) ||
       contains(fromJSON('["success", "failure"]'), needs.build-with-repo.result))
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: dnf -y install git createrepo_c dnf5-plugins jq gnupg2 rpm-sign gh

      - uses: actions/checkout@v7

      # One directory per artifact, rpms-<pkg>-<chroot>, to tell the packages
      # apart
      - uses: actions/download-artifact@v7
        with:
          pattern: rpms-*
          path: built

      - uses: actions/download-artifact@v7
        with:
          pattern: tested-*
          merge-multiple: true
          path: tested

      - name: Leave out untested RPMs
        run: |
          mkdir -p new
          for dir in built/rpms-*; do
            [ -d "$dir" ] || continue
            name=${dir#built/rpms-}
            chroot=$(grep -oE 'fedora-[0-9]+-[a-z0-9_]+$' <<< "$name")
            package=${name%-"$chroot"}
            if [ ! -e "tested/$package-$chroot" ]; then
              echo "::warning::$package for $chroot not published: its tests did not pass"
              continue
            fi
            cp -a "$dir"/. new/
          done

      - name: Update repository
        env:
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REPO_NAME: ${{ github.event.repository.name }}
          # The RPMs are assets of a release per chroot
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # ASCII-armoured secret key without a passphrase, from
          # gpg --export-secret-keys --armor
          SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        # The container runs as root but the checkout is owned by the runner
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The RPM_SIGNING_KEY secret is not set"
            exit 1
          fi
          gpg --batch --import <<< "$SIGNING_KEY"
          GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          export GPG_KEY
          .github/scripts/publish.sh new

