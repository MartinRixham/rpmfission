name: Build RPMs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to build, or "all"
        default: all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fedora releases to build for. Add a release when it branches or ships, and
  # remove it when it goes end of life; its chroot is then deleted from the
  # published repository on the next publish.
  FEDORA_RELEASES: '[44]'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A package is a top-level directory holding <name>/<name>.spec.
      # Each build is one package in one mock chroot (named as COPR names it).
      # A chroot not yet on gh-pages, such as a newly added release, gets
      # every package.
      - id: builds
        env:
          REQUESTED: ${{ inputs.packages }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(for spec in */*.spec; do dirname "$spec"; done | sort -u)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REQUESTED" = all ]; then
              selected=$all
            else
              selected=$REQUESTED
            fi
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            selected=$all
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(\.copr|\.github)/'; then
            selected=$all
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | cut -d/ -f1 | sort -u)
            selected=$(comm -12 <(echo "$all") <(echo "$changed"))
          fi

          builds=$(
            for release in $(jq -r '.[]' <<< "$FEDORA_RELEASES"); do
              chroot=fedora-$release-x86_64
              if git rev-parse -q --verify origin/gh-pages > /dev/null &&
                 [ -n "$(git ls-tree -d origin/gh-pages -- "$chroot")" ]; then
                packages=$selected
              else
                packages=$all
              fi
              for package in $packages; do
                jq -nc --arg package "$package" --arg chroot "$chroot" \
                  '{package: $package, chroot: $chroot}'
              done
            done | jq -sc .
          )
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: dnf -y install mock rpmdevtools rpm-build cargo make

      # Same entry point COPR's make_srpm method uses
      - name: Build SRPM
        run: make -f .copr/Makefile srpm outdir=srpm spec=${{ matrix.package }}/${{ matrix.package }}.spec

      - name: Build RPMs
        run: |
          mock -r ${{ matrix.chroot }} --isolation=simple \
            --rebuild srpm/*.src.rpm --resultdir results

      # Staged under <chroot>/ so the publish job knows where each RPM goes
      - name: Stage RPMs
        run: |
          mkdir -p rpms/${{ matrix.chroot }}
          cp -p results/*.rpm rpms/${{ matrix.chroot }}/

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.package }}-${{ matrix.chroot }}
          path: results/*.log

      - uses: actions/upload-artifact@v7
        with:
          name: rpms-${{ matrix.package }}-${{ matrix.chroot }}
          path: rpms/

  publish:
    needs: [plan, build]
    # Publish whatever built, even if some packages in the matrix failed
    if: always() && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: dnf -y install git createrepo_c dnf5-plugins jq

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: rpms-*
          merge-multiple: true
          path: new

      - name: Update repository
        env:
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REPO_NAME: ${{ github.event.repository.name }}
        # The container runs as root but the checkout is owned by the runner
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/publish.sh new

