name: Check upstream releases

# Keeps an issue open for each package whose upstream GitHub repository has a
# newer release (see .github/scripts/check-updates.sh), and for each package
# whose patches differ from those of the Fedora package it takes them from
# (see .github/scripts/check-fedora-patches.sh). The run fails while any such
# difference remains.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install tools
        run: dnf -y install git gh jq rpmdevtools rpm-build cargo-rpm-macros

      - uses: actions/checkout@v7

      - name: Check upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/check-updates.sh

      # Even if a package is out of date
      - name: Compare patches with Fedora's
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/check-fedora-patches.sh
